name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in $(git ls-files '*.mjs'); do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Demo renders from the saved data
        run: node scripts/build-demo.mjs --from-cache
