name: Live data refresh

# Every 15 minutes: re-scan the four venues, rebuild the pairs and publish the page data to the live-data branch
# (one force-pushed commit, so main's history stays the team's). The hosted demo reads it on every page load.
# The AI review of new or changed pairs runs when GEMINI_API_KEY is set as a repository secret; the Solana
# attestations of new or changed verdicts run once a day when SOLANA_DEVNET_KEY is set. Without keys both are skipped.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SOLANA_DEVNET_KEY: ${{ secrets.SOLANA_DEVNET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # the AI cache and the attestations carry over between runs through the live-data branch
      - name: Restore the previous live data
        run: |
          git fetch --depth=1 origin live-data 2>/dev/null || exit 0
          for f in ai-cache.json attestations.json; do
            git show FETCH_HEAD:$f > research/$f.new 2>/dev/null && mv research/$f.new research/$f || rm -f research/$f.new
          done
          git show FETCH_HEAD:live-data.json > previous.json 2>/dev/null || true

      - name: Fetch markets and rebuild the pairs
        run: node scripts/build-demo.mjs

      # a venue outage would otherwise publish a page with half the pairs missing
      - name: Sanity check
        run: |
          node -e "
            const fs = require('fs');
            const prev = fs.existsSync('previous.json') ? 'previous.json' : null;
            const count = f => JSON.parse(fs.readFileSync(f, 'utf8')).pairs.length;
            const now = count('research/pairs-all.json');
            const before = prev ? count(prev) : JSON.parse(require('child_process').execSync('git show HEAD:research/pairs-all.json', { maxBuffer: 1 << 28 })).pairs.length;
            console.log('pairs', before, '->', now);
            if (now < before * 0.5) { console.error('Too few pairs; not publishing.'); process.exit(1); }
          "

      - name: AI review of new or changed pairs
        if: env.GEMINI_API_KEY != ''
        continue-on-error: true
        run: node scripts/ai-analyze.mjs --all

      - name: Attest new or changed verdicts on Solana devnet (daily)
        if: env.SOLANA_DEVNET_KEY != '' && (github.event.schedule == '5 6 * * *' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: |
          mkdir -p .solana
          printf '%s' "$SOLANA_DEVNET_KEY" > .solana/devnet-authority.json
          node scripts/attest.mjs --all

      - name: Build the page data
        run: |
          mkdir -p live
          node scripts/build-demo.mjs --from-cache --data-out live/live-data.json
          cp research/ai-cache.json research/attestations.json live/

      - name: Publish to the live-data branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd live
          git init -q -b live-data
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
