  <title>RuleGuard</title>
  <rect width="512" height="512" rx="112" fill="#0E1726"/>
  <!-- shield: the guard -->
  <path d="M256 84 L398 136 V246 C398 336 338 400 256 432 C174 400 114 336 114 246 V136 Z"
